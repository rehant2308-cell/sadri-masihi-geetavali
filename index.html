<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b63"><title>सादरी मसीही गीतावली</title>
<style>
:root{--navy:#173b63;--gold:#f2c46d;--ink:#182536;--panel:rgba(255,255,255,.94)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Devanagari",sans-serif;color:var(--ink);background:#eef2f7;background-size:cover;background-position:center;background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;background:rgba(245,247,251,.88);z-index:-1}
header{background:linear-gradient(145deg,#173b63,#28618d);color:white;padding:25px 18px 22px;border-radius:0 0 24px 24px}
header .eyebrow{font-size:12px;letter-spacing:1.3px;color:#f7d99c}h1{font-size:24px;margin:8px 0}header p{margin:0;color:#e5edf5;font-size:14px}
main{max-width:720px;margin:auto;padding:17px}.section-title{font-size:17px;font-weight:700;margin:20px 2px 12px}
.search,input,textarea{width:100%;padding:13px;border:1px solid #d9e0e8;border-radius:11px;font:inherit;background:white;margin:7px 0}
.song{display:flex;align-items:center;gap:13px;background:var(--panel);padding:15px;margin:10px 0;border-radius:14px;border:1px solid #edf0f4;width:100%;text-align:left;color:inherit;font:inherit}
.num{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:#eaf1f8;color:var(--navy);font-weight:700;flex-shrink:0}
.song-name{font-weight:700;font-size:16px}.sub{font-size:12px;color:#748195;margin-top:3px}
button{cursor:pointer}.detail{display:none}.back,.secondary{border:0;background:#e8eff6;color:var(--navy);padding:10px 14px;border-radius:10px;font-weight:650}
.detail h2{font-size:22px;margin:20px 0 14px}.lyrics{white-space:pre-wrap;line-height:2;font-size:18px;background:var(--panel);border-radius:16px;padding:20px;border:1px solid #edf0f4;min-height:180px}
.admin{margin-top:22px;border-top:1px solid #dce3eb;padding-top:15px}.admin summary{color:#53657a;font-size:14px;font-weight:650;cursor:pointer}
.primary{background:var(--navy);color:white;border:0;padding:12px 16px;border-radius:10px;font-weight:650;margin:5px 4px 5px 0}
.danger{background:#a12e36;color:white;border:0;padding:10px 13px;border-radius:9px;margin:5px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.panel{background:var(--panel);padding:13px;border-radius:13px;margin:12px 0;border:1px solid #e4e9ef}
.small{font-size:12px;color:#66758a;line-height:1.6}.hidden{display:none!important}footer{text-align:center;color:#8491a2;font-size:12px;padding:25px}
</style></head>
<body>
<header><div class="eyebrow">🎵 SADRI CHRISTIAN SONGS</div><h1>सादरी मसीही गीतावली</h1><p>प्रभु की स्तुति के गीत — पढ़ें और गाएँ</p></header>
<main>
<section id="listView"><div class="section-title">गीतों की सूची</div><input id="search" class="search" placeholder="गीत का नाम खोजें..." autocomplete="off"><div id="songList"></div></section>
<section id="detailView" class="detail"><button class="back" id="backBtn">← गीत सूची</button><h2 id="songTitle"></h2><div class="lyrics" id="songLyrics"></div></section>
<details class="admin"><summary>🔐 मालिक / Admin सेटिंग</summary>
<div id="loginBox" class="panel"><p><b>केवल मालिक के लिए लॉगिन</b></p><input id="emailInput" type="email" placeholder="Admin ईमेल"><input id="passwordInput" type="password" placeholder="पासवर्ड"><button class="primary" id="loginBtn">लॉगिन</button><p class="small">मालिक का ईमेल: rehant2308@gmail.com</p></div>
<div id="adminPanel" class="hidden"><div class="panel"><b>गीत जोड़ें / एडिट करें</b><input id="songTitleInput" placeholder="गीत का नाम"><textarea id="songLyricsInput" rows="9" placeholder="गीत के पूरे बोल"></textarea><div class="row"><button class="primary" id="saveSong">सेव करें</button><button class="secondary" id="cancelEdit">रद्द करें</button></div><div id="adminSongList"></div></div>
<div class="panel"><b>ऐप का वॉलपेपर बदलें</b><input id="wallpaperInput" type="file" accept="image/*"><button class="secondary" id="clearWallpaper">वॉलपेपर हटाएँ</button><p class="small">वॉलपेपर सभी उपयोगकर्ताओं के लिए बदलेगा।</p></div><div class="panel"><button class="secondary" id="logoutBtn">लॉगआउट</button></div></div></details>
<p id="status" class="small" role="status"></p>
</main><footer>सादरी मसीही गीतावली</footer>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBmQ9x-cBYvhABEyEFwfLKwDc4S3w9kXSw",authDomain:"sadri-masihee-geetavali.firebaseapp.com",projectId:"sadri-masihee-geetavali",storageBucket:"sadri-masihee-geetavali.firebasestorage.app",messagingSenderId:"417759941995",appId:"1:417759941995:web:0d80e7ac8ac0f0bc00a82e",measurementId:"G-GDMLPWFBNV"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore(), storage=firebase.storage();
const OWNER='rehant2308@gmail.com';
const starter=[
{title:"यीशु मोके प्यार करेला",lyrics:`यीशु मोके प्यार करेला\n\nअनन्त जीवन डहरे डहरे,\nमसीह मोके प्यार करेला।\n\n1. प्रार्थना कईर के यीशु के पाओना पाओना।\n   प्रार्थना कईर के मसीह के पाओना।\n\n2. समाज जाइके यीशु के पाओना पाओना।\n   समाज जाइके मसीह के पाओना।\n\n3. गिरजा जाइके यीशु के पाओना पाओना।\n   गिरजा जाइके मसीह के पाओना।\n\n4. बिनती कईर के यीशु के पाओना पाओना।\n   बिनती कईर के मसीह के पाओना।`},
{title:"जीवन डहर यीशु हेके मोर",lyrics:`कोरस:\nजीवन डहर यीशु हेके मोर।\nजीवन डहर मसीह हेके मोर।\nडहर-डहर लेई चलेला।\n\n1. प्रभु यीशु कहेला रे,\n   मार्ग सत्य जीवन मोहे हेको। (2)\n\n2. प्रभु यीशु कहेला रे,\n   जीवन कर ज्योति मोहे हेको। (2)\n\n3. प्रभु यीशु कहेला रे,\n   भला चरवाहा मोहे हेको। (2)\n\n4. प्रभु यीशु कहेला रे,\n   स्वर्ग कर दुरा मोहे हेको। (2)`},
{title:"प्रभु यीशु तोय मोके",lyrics:`कोरस:\nप्रभु यीशु तोय मोके,\nजिन्दगी भर ना छोड़बे। (2)\n\n1. चोरी-हारी छोड़ देलों,\n   तोर सेवा करेक ले। (2)\n\n2. पाप-बुराई छोड़ देलों,\n   तोर सेवा करेक ले। (2)\n\n3. लोभ-लालच छोइड़ देलों,\n   तोर सेवा करेक ले। (2)\n\n4. हड़िया-दारू छोइड़ देलों,\n   तोर सेवा करेक ले। (2)\n\n5. अपने के सौंइप देलों,\n   तोर सेवा करेक ले। (2)`}
];
let songs=[],editingId=null,isOwner=false;
const $=id=>document.getElementById(id);
function msg(s){$('status').textContent=s;}
function render(){const q=$('search').value.trim().toLowerCase();$('songList').innerHTML='';songs.filter(s=>s.title.toLowerCase().includes(q)).forEach((s,i)=>{const b=document.createElement('button');b.className='song';b.innerHTML=`<span class="num">${i+1}</span><span><span class="song-name"></span><div class="sub">पूरा गीत पढ़ने के लिए छुएँ</div></span>`;b.querySelector('.song-name').textContent=s.title;b.onclick=()=>openSong(s.id);$('songList').appendChild(b);});if(!songs.length)$('songList').textContent='अभी कोई गीत उपलब्ध नहीं है।';}
function openSong(id){const s=songs.find(x=>x.id===id);if(!s)return;$('songTitle').textContent=s.title;$('songLyrics').textContent=s.lyrics;$('listView').style.display='none';$('detailView').style.display='block';scrollTo(0,0);}
function showList(){$('detailView').style.display='none';$('listView').style.display='block';scrollTo(0,0);}
$('backBtn').onclick=showList;$('search').oninput=render;
async function loadSongs(){try{const snap=await db.collection('songs').get();const snap=await db.collection('songs').get();songs=snap.docs.map(d=>({id:d.id,...d.data()}));render();if(!songs.length)msg('गीत अभी डेटाबेस में नहीं हैं। Admin लॉगिन करके गीत जोड़ें।');else msg('गीत ऑनलाइन अपडेट हो रहे हैं।');}catch(e){msg('डेटाबेस लोड नहीं हुआ: '+e.message);}}
function renderAdmin(){const box=$('adminSongList');box.innerHTML='';songs.forEach((s,i)=>{const d=document.createElement('div');d.className='panel';const name=document.createElement('b');name.textContent=(i+1)+'. '+s.title;const edit=document.createElement('button');edit.className='secondary';edit.textContent='एडिट';edit.onclick=()=>{editingId=s.id;$('songTitleInput').value=s.title;$('songLyricsInput').value=s.lyrics;};const del=document.createElement('button');del.className='danger';del.textContent='डिलीट';del.onclick=async()=>{if(confirm('क्या यह गीत सभी के लिए हटाना है?')){try{await db.collection('songs').doc(s.id).delete();await loadSongs();renderAdmin();msg('गीत सभी के लिए डिलीट हो गया।');}catch(e){alert(e.message);}}};d.append(name,edit,del);box.append(d);});}
$('loginBtn').onclick=async()=>{const email=$('emailInput').value.trim().toLowerCase(),pass=$('passwordInput').value;if(email!==OWNER){alert('यह Admin ईमेल नहीं है।');return;}try{await auth.signInWithEmailAndPassword(email,pass);}catch(e){alert('लॉगिन नहीं हुआ: '+e.message);}};
$('logoutBtn').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async user=>{isOwner=!!user&&user.email===OWNER&&user.emailVerified;$('loginBox').classList.toggle('hidden',isOwner);$('adminPanel').classList.toggle('hidden',!isOwner);if(isOwner){renderAdmin();msg('Admin लॉगिन सफल।');}else if(user){await auth.signOut();alert('केवल सत्यापित मालिक ईमेल को अनुमति है।');}});
$('saveSong').onclick=async()=>{if(!isOwner)return;const title=$('songTitleInput').value.trim(),lyrics=$('songLyricsInput').value.trim();if(!title||!lyrics){alert('गीत का नाम और बोल लिखें।');return;}try{const data={title,lyrics,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(editingId)await db.collection('songs').doc(editingId).update(data);else await db.collection('songs').add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});editingId=null;$('songTitleInput').value='';$('songLyricsInput').value='';await loadSongs();renderAdmin();msg('गीत सभी उपयोगकर्ताओं के लिए सेव हो गया।');}catch(e){alert('सेव नहीं हुआ: '+e.message);}};
$('cancelEdit').onclick=()=>{editingId=null;$('songTitleInput').value='';$('songLyricsInput').value='';};
$('wallpaperInput').onchange=async e=>{if(!isOwner)return;const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('5 MB से छोटी तस्वीर चुनें।');return;}try{const ref=storage.ref('wallpaper/main-'+Date.now());await ref.put(f);const url=await ref.getDownloadURL();await db.collection('settings').doc('app').set({wallpaper:url,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});document.body.style.backgroundImage=`url("${url}")`;msg('वॉलपेपर सभी के लिए अपडेट हो गया।');}catch(err){alert('वॉलपेपर अपलोड नहीं हुआ: '+err.message);}};
$('clearWallpaper').onclick=async()=>{if(!isOwner)return;try{await db.collection('settings').doc('app').set({wallpaper:''},{merge:true});document.body.style.backgroundImage='';msg('वॉलपेपर हट गया।');}catch(e){alert(e.message);}};
async function loadWallpaper(){try{const d=await db.collection('settings').doc('app').get();if(d.exists&&d.data().wallpaper)document.body.style.backgroundImage=`url("${d.data().wallpaper}")`;}catch(e){}}
loadSongs();loadWallpaper();
</script>

</body></html>
